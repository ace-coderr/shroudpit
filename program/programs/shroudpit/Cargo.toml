[package]
name = "shroudpit"
version = "0.1.0"
description = "Shroudpit: private trading leagues on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "shroudpit"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "0.18", features = ["anchor", "access-control", "vrf"] }
solana-sha256-hasher = "3.1.0"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
